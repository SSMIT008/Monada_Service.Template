name: Publish Template # Workflow name

# Launch triggers
on:
  push:
    tags:
      - 'v*' # Triggered when pushing a tag starting with 'v' >> git push origin v1.0.0

  workflow_dispatch: # Ability to trigger manually from the GitHub UI
    inputs:
      version:
        description: 'Package version, for example 1.0.0'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest # Running on Ubuntu

    permissions:
      contents: read   # Reading repository contents
      packages: write  # Publishing package to GitHub Packages

    steps:
      - uses: actions/checkout@v6 # Cloning the repository

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x' # Installing .NET 10

      - name: Get package version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
        # Manual run: uses entered version, e.g. 1.0.0
        # Tag run: extracts version from Git tag, e.g. v1.0.0 -> 1.0.0

      - name: Pack
        run: dotnet pack --configuration Release -p:PackageVersion=${{ steps.version.outputs.VERSION }}

      # Configure GitHub Packages as a NuGet source and publish the generated package
      - name: Publish to GitHub Packages
        run: |
          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

          dotnet nuget push bin/Release/*.nupkg \
            --source github \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate